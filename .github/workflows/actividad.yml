name: Actividad pública

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actividad-publica
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Comprobar el resumen
        run: python3 -m unittest discover -s pruebas -v
      - name: Actualizar la actividad pública
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/actividad.py --publicar
